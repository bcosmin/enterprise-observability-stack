---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-conf
  namespace: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        send_batch_size: 1024
        timeout: 5s

    exporters:
      # Export metrics to Mimir / Prometheus compatible backend
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "otel"

      # Export traces to Grafana Tempo
      otlp/tempo:
        endpoint: "tempo.observability.svc.cluster.local:4317"
        tls:
          insecure: true

      # Export logs to Grafana Loki
      otlphttp/loki:
        endpoint: "http://loki.observability.svc.cluster.local:3100/otlp"

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]